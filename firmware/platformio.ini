
[platformio]
default_envs = yolo_uno

[env:yolo_uno]

platform = espressif32 @ 6.12.0
board = yolo_uno
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    robtillaart/DHT20 @ ^0.3.3
    crankyoldgit/IRremoteESP8266 @ 2.9.0
    madhephaestus/ESP32Servo @ 1.2.1
    marcoschwartz/LiquidCrystal_I2C @ 1.1.4
    bblanchon/ArduinoJson @ 7.4.3
    knolleary/PubSubClient @ 2.8

[env:yolo_uno_ota]

extends = env:yolo_uno
upload_protocol = espota
extra_scripts = post:scripts/ota_upload.py

[env:yolo_uno_mock]
extends = env:yolo_uno
build_flags =
    ${env:yolo_uno.build_flags}
    -D SMART_CLASSROOM_MOCK_MODE=1
    -D SMART_CLASSROOM_DEVICE_ID=\"classroom-01-sim\"

[env:yolo_uno_coreiot_100]
extends = env:yolo_uno
build_flags =
    ${env:yolo_uno.build_flags}
    -D SMART_CLASSROOM_COREIOT_OTA=1
    -D SMART_CLASSROOM_FW_VERSION=\"1.0.0\"

[env:yolo_uno_coreiot_110]
extends = env:yolo_uno_coreiot_100
build_flags =
    ${env:yolo_uno.build_flags}
    -D SMART_CLASSROOM_COREIOT_OTA=1
    -D SMART_CLASSROOM_FW_VERSION=\"1.1.0\"

[env:yolo_bit]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200

board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = default.csv

build_flags =
    -D SMART_CLASSROOM_YOLOBIT=1

lib_deps =
    ${env:yolo_uno.lib_deps}

[env:yolo_bit_ota]
extends = env:yolo_bit
upload_protocol = espota
extra_scripts = post:scripts/ota_upload.py
